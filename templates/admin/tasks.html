<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quản lý nhiệm vụ - Admin Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../static/css/layout/layout_admin/admin.css">

</head>
<body>

<div class="admin">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-name">TRAODOI</div>
      <div class="sidebar-brand-sub">Admin Console · v3.2</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Tổng quan</div>
      <button class="sidebar-link" data-view="dashboard">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="4.5" height="4.5" stroke="currentColor" stroke-width="1.3"/>
            <rect x="7.5" y="2" width="4.5" height="4.5" stroke="currentColor" stroke-width="1.3"/>
            <rect x="2" y="7.5" width="4.5" height="4.5" stroke="currentColor" stroke-width="1.3"/>
            <rect x="7.5" y="7.5" width="4.5" height="4.5" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </span>
        Dashboard
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Dịch vụ & Nhiệm vụ</div>
      <button class="sidebar-link active" data-view="tasks">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3 7L6 10L11 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Quản lý nhiệm vụ
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Tài chính</div>
      <button class="sidebar-link" data-view="transactions">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2" y="3" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <path d="M2 6H12" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </span>
        Giao dịch nạp tiền
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Người dùng</div>
      <button class="sidebar-link" data-view="users">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="4" r="2.5" stroke="currentColor" stroke-width="1.3"/>
            <path d="M2.5 12C2.5 9.5 4.5 8 7 8C9.5 8 11.5 9.5 11.5 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Danh sách users
      </button>
      <button class="sidebar-link" data-view="reports">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 2V7M7 10H7.01M2 7C2 4.2 4.2 2 7 2C9.8 2 12 4.2 12 7C12 9.8 9.8 12 7 12C4.2 12 2 9.8 2 7Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Xử lý vi phạm
      </button>
      <button class="sidebar-link" data-view="user-config">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.3"/>
            <path d="M7 2V3M7 11V12M2 7H3M11 7H12M3.5 3.5L4.2 4.2M9.8 9.8L10.5 10.5M10.5 3.5L9.8 4.2M4.2 9.8L3.5 10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Cấu hình tài khoản
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Hệ thống</div>
      <button class="sidebar-link" data-view="config">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.3"/>
            <path d="M7 1V2.5M7 11.5V13M1 7H2.5M11.5 7H13M2.5 2.5L3.5 3.5M10.5 10.5L11.5 11.5M11.5 2.5L10.5 3.5M3.5 10.5L2.5 11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Cấu hình chung
      </button>
      <button class="sidebar-link" data-view="logs">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3 3H11V11H3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M5 5.5H9M5 7.5H9M5 9.5H7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Nhật ký hoạt động
      </button>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Mở menu">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 3.5H12M2 7H12M2 10.5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <h1 class="page-title-admin" id="pageTitle">Quản lý nhiệm vụ</h1>
      </div>

      <div class="topbar-right">

        <button class="btn btn-ghost btn-sm" id="refreshBtn" title="Làm mới dữ liệu">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M12 7C12 9.8 9.8 12 7 12C4.2 12 2 9.8 2 7C2 4.2 4.2 2 7 2C9 2 10.7 3.1 11.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M12 2V5H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="admin-avatar" title="Admin">AD</span>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      


      <div class="panel">
        <div class="filter-bar-admin">
          <div class="filter-search-admin">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M9.5 9.5L12.5 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <input type="text" placeholder="Tìm mã NV, tên người tạo..." id="searchTasks" />
          </div>
          <select class="filter-select-admin" id="filterPlatform">
            <option value="">Tất cả nền tảng</option>
            <option value="Facebook">Facebook</option>
            <option value="TikTok">TikTok</option>
            <option value="Instagram">Instagram</option>
            <option value="Youtube">Youtube</option>
          </select>
          <select class="filter-select-admin" id="filterStatus">
            <option value="">Tất cả trạng thái</option>
            <option value="pending">Chờ duyệt</option>
            <option value="running">Đang chạy</option>
            <option value="completed">Đã hoàn thành</option>
            <option value="rejected">Bị từ chối</option>
          </select>
        </div>

        <table class="data-table-admin" style="min-width: 800px;">
          <thead>
            <tr>
              <th>Mã NV</th>
              <th>Người tạo</th>
              <th>Nền tảng</th>
              <th>Yêu cầu (Action)</th>
              <th>Thù lao / Số lượng</th>
              <th>Trạng thái</th>
              <th class="right">Hành động</th>
            </tr>
          </thead>
          <tbody id="tasksTableBody">
            <!-- JS -->
          </tbody>
        </table>
      </div>

    </main>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="check">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
      <path d="M2 5L4 7L8 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span id="toastMsg">Thành công</span>
</div>

<script>
(function(){
  'use strict';

    const PAGE_TITLES = {
    dashboard: 'Dashboard',
    tasks: 'Quản lý nhiệm vụ',
    transactions: 'Giao dịch nạp tiền',
    users: 'Danh sách users',
    reports: 'Xử lý vi phạm',
    'user-config': 'Cấu hình tài khoản',
    config: 'Cấu hình chung',
    logs: 'Nhật ký hoạt động'
  };

  /* ============ SIDEBAR NAVIGATION ============ */
  document.querySelectorAll('.sidebar-link').forEach(link => {
    link.addEventListener('click', () => {
      const view = link.dataset.view;
      if (view === 'tasks') {
        window.location.href = '/admin/tasks';
        return;
      } else if (view === 'transactions') {
        window.location.href = '/admin/transactions';
        return;
      } else if (view === 'users') {
        window.location.href = '/admin/users';
        return;
      } else if (view === 'reports') {
        window.location.href = '/admin/reports';
        return;
      } else if (view === 'user-config') {
        window.location.href = '/admin/user-config';
        return;
      } else if (view === 'dashboard') {
        window.location.href = '/admin';
        return;
      }
      
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      const titleEl = document.getElementById('pageTitle');
      if (titleEl) titleEl.textContent = PAGE_TITLES[view] || 'Admin';
      closeSidebar();
    });
  });

  /* ============ SIDEBAR MOBILE ============ */
  const sidebar = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const menuToggle = document.getElementById('menuToggle');

  function openSidebar() {
    if (sidebar) sidebar.classList.add('open');
    if (sidebarBackdrop) sidebarBackdrop.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar() {
    if (sidebar) sidebar.classList.remove('open');
    if (sidebarBackdrop) sidebarBackdrop.classList.remove('on');
    document.body.style.overflow = '';
  }
  if (menuToggle) menuToggle.addEventListener('click', openSidebar);
  if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

  /* ============ REFRESH ============ */
  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', function() {
      this.style.transform = 'rotate(360deg)';
      this.style.transition = 'transform .6s ease';
      setTimeout(() => {
        this.style.transform = '';
        this.style.transition = '';
      }, 600);
      showToast('Đã làm mới dữ liệu.');
    });
  }

  /* ============ MODAL CLOSE ============ */
  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
    if (!document.querySelector('.modal-overlay.active')) {
      document.body.style.overflow = '';
    }
  }
  window.closeModal = closeModal;

  document.querySelectorAll('[data-close]').forEach(b => {
    b.addEventListener('click', () => {
      const overlay = b.closest('.modal-overlay');
      if (overlay) closeModal(overlay.id);
    });
  });
  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(m => closeModal(m.id));
      closeSidebar();
    }
  });

  /* ============ TOAST ============ */
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  let toastTimer;
  window.showToast = function(msg) {
    if (!toast) return;
    toastMsg.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('on'), 2800);
  };

})();
</script>
<script>
(function(){
  'use strict';
  
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const ALL_TASKS = [
    { id: '#T-4912', creator: 'Trần Văn A', handle: '@tranvana', platform: 'Facebook', req: 'Like & Follow fanpage', reward: '120', qty: '1000', status: 'pending', statusLabel: 'Chờ duyệt' },
    { id: '#T-4911', creator: 'Lê Thị B', handle: '@lethib', platform: 'TikTok', req: 'Thả tim & Comment', reward: '80', qty: '500', status: 'running', statusLabel: 'Đang chạy' },
    { id: '#T-4910', creator: 'Phạm Văn C', handle: '@phamvanc', platform: 'Instagram', req: 'Follow tài khoản', reward: '50', qty: '200', status: 'pending', statusLabel: 'Chờ duyệt' },
    { id: '#T-4909', creator: 'Nguyễn Thị D', handle: '@nguyenthid', platform: 'Youtube', req: 'Sub channel', reward: '200', qty: '150', status: 'running', statusLabel: 'Đang chạy' },
    { id: '#T-4908', creator: 'Hoàng Văn E', handle: '@hoangvane', platform: 'Facebook', req: 'Share bài viết', reward: '150', qty: '300', status: 'completed', statusLabel: 'Hoàn thành' },
    { id: '#T-4907', creator: 'Vũ Thị F', handle: '@vuthif', platform: 'TikTok', req: 'Share video', reward: '70', qty: '1000', status: 'rejected', statusLabel: 'Từ chối' }
  ];

  function renderTable() {
    const q = (document.getElementById('searchTasks').value || '').toLowerCase();
    const plat = document.getElementById('filterPlatform').value;
    const stat = document.getElementById('filterStatus').value;

    let list = ALL_TASKS.slice();
    if(q) {
      list = list.filter(x => x.id.toLowerCase().includes(q) || x.creator.toLowerCase().includes(q) || x.handle.toLowerCase().includes(q));
    }
    if(plat) list = list.filter(x => x.platform === plat);
    if(stat) list = list.filter(x => x.status === stat);

    const tbody = document.getElementById('tasksTableBody');
    if(!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2.5rem;color:var(--muted);font-size:.8125rem">Không tìm thấy nhiệm vụ nào.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(t => {
      let stCls = 'mute';
      if(t.status === 'pending') stCls = 'warn';
      if(t.status === 'running') stCls = 'info';
      if(t.status === 'completed') stCls = 'ok';
      if(t.status === 'rejected') stCls = 'danger';

      let actions = '';
      if(t.status === 'pending') {
        actions = `<button class="btn btn-success btn-sm" onclick="showToast('Đã duyệt nhiệm vụ ${t.id}')">Duyệt</button>
                   <button class="btn btn-danger btn-sm" onclick="showToast('Đã từ chối nhiệm vụ ${t.id}')">Từ chối</button>`;
      } else {
        actions = `<button class="btn btn-secondary btn-sm" onclick="showToast('Đang xem chi tiết ${t.id}')">Chi tiết</button>`;
      }

      return `
        <tr>
          <td><span class="cell-mono">${t.id}</span></td>
          <td>
            <div class="user-cell">
              <span class="mini-avatar" style="border-radius:6px">${t.creator.charAt(0)}</span>
              <div>
                <div class="user-cell-name">${escapeHtml(t.creator)}</div>
                <div class="user-cell-handle">${escapeHtml(t.handle)}</div>
              </div>
            </div>
          </td>
          <td><span style="font-weight:500">${escapeHtml(t.platform)}</span></td>
          <td>${escapeHtml(t.req)}</td>
          <td>
            <div style="font-weight:600;color:var(--accent)">${t.reward} <small style="color:var(--muted);font-weight:400">CR</small></div>
            <div class="cell-mono" style="margin-top:2px">x ${t.qty}</div>
          </td>
          <td><span class="status-pill ${stCls}">${t.statusLabel}</span></td>
          <td class="cell-right">
            <div class="row-actions">${actions}</div>
          </td>
        </tr>
      `;
    }).join('');
  }

  document.getElementById('searchTasks').addEventListener('input', renderTable);
  document.getElementById('filterPlatform').addEventListener('change', renderTable);
  document.getElementById('filterStatus').addEventListener('change', renderTable);

  renderTable();
})();
</script>

</body>
</html>
