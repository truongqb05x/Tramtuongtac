<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Xử lý vi phạm - Admin Console</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../static/css/layout/layout_admin/admin.css">

</head>
<body>

<div class="admin">
  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-name">TRAODOI</div>
      <div class="sidebar-brand-sub">Admin Console · v3.2</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Tổng quan</div>
      <button class="sidebar-link" data-view="dashboard">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2" y="2" width="4.5" height="4.5" stroke="currentColor" stroke-width="1.3"/>
            <rect x="7.5" y="2" width="4.5" height="4.5" stroke="currentColor" stroke-width="1.3"/>
            <rect x="2" y="7.5" width="4.5" height="4.5" stroke="currentColor" stroke-width="1.3"/>
            <rect x="7.5" y="7.5" width="4.5" height="4.5" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </span>
        Dashboard
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Dịch vụ & Nhiệm vụ</div>
      <button class="sidebar-link" data-view="tasks">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3 7L6 10L11 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Quản lý nhiệm vụ
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Tài chính</div>
      <button class="sidebar-link" data-view="transactions">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <rect x="2" y="3" width="10" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <path d="M2 6H12" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </span>
        Giao dịch nạp tiền
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Người dùng</div>
      <button class="sidebar-link" data-view="users">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="4" r="2.5" stroke="currentColor" stroke-width="1.3"/>
            <path d="M2.5 12C2.5 9.5 4.5 8 7 8C9.5 8 11.5 9.5 11.5 12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Danh sách users
      </button>
      <button class="sidebar-link active" data-view="reports">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M7 2V7M7 10H7.01M2 7C2 4.2 4.2 2 7 2C9.8 2 12 4.2 12 7C12 9.8 9.8 12 7 12C4.2 12 2 9.8 2 7Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Xử lý vi phạm
      </button>
      <button class="sidebar-link" data-view="user-config">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="3" stroke="currentColor" stroke-width="1.3"/>
            <path d="M7 2V3M7 11V12M2 7H3M11 7H12M3.5 3.5L4.2 4.2M9.8 9.8L10.5 10.5M10.5 3.5L9.8 4.2M4.2 9.8L3.5 10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Cấu hình tài khoản
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-label">Hệ thống</div>
      <button class="sidebar-link" data-view="stats">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 12V5M7 12V2M12 12V7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M2 12H12" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Thống kê hệ thống
      </button>
      <button class="sidebar-link" data-view="config">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <circle cx="7" cy="7" r="2" stroke="currentColor" stroke-width="1.3"/>
            <path d="M7 1V2.5M7 11.5V13M1 7H2.5M11.5 7H13M2.5 2.5L3.5 3.5M10.5 10.5L11.5 11.5M11.5 2.5L10.5 3.5M3.5 10.5L2.5 11.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Cấu hình chung
      </button>
      <button class="sidebar-link" data-view="logs">
        <span class="link-icon">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M3 3H11V11H3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            <path d="M5 5.5H9M5 7.5H9M5 9.5H7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Nhật ký hoạt động
      </button>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ================= MAIN ================= -->
  <div class="main">
    <!-- Topbar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" id="menuToggle" aria-label="Mở menu">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M2 3.5H12M2 7H12M2 10.5H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
        <h1 class="page-title-admin" id="pageTitle">Xử lý vi phạm</h1>
      </div>

      <div class="topbar-right">

        <button class="btn btn-ghost btn-sm" id="refreshBtn" title="Làm mới dữ liệu">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M12 7C12 9.8 9.8 12 7 12C4.2 12 2 9.8 2 7C2 4.2 4.2 2 7 2C9 2 10.7 3.1 11.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <path d="M12 2V5H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span class="admin-avatar" title="Admin">AD</span>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      
      <div class="panel">
        <div class="filter-bar-admin">
          <div class="filter-search-admin">
            <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
              <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/>
              <path d="M9.5 9.5L12.5 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <input type="text" placeholder="Tìm ID báo cáo, tài khoản bị báo cáo..." id="searchReports" />
          </div>
          <select class="filter-select-admin" id="filterReason">
            <option value="">Tất cả lý do</option>
            <option value="Pháp luật">Vi phạm pháp luật</option>
            <option value="Tài khoản ảo">Tài khoản ảo / Bot</option>
            <option value="Gian lận">Gian lận nhiệm vụ</option>
            <option value="Spam">Spam / Rác</option>
          </select>
          <select class="filter-select-admin" id="filterStatus">
            <option value="">Tất cả trạng thái</option>
            <option value="pending">Chờ xử lý</option>
            <option value="reviewing">Đang xem xét</option>
            <option value="resolved">Đã xử lý</option>
          </select>
        </div>

        <div style="overflow-x: auto;">
          <table class="data-table-admin" style="min-width: 900px; width: 100%;">
            <thead>
              <tr>
                <th>ID</th>
                <th>Người bị báo cáo</th>
                <th>Lý do vi phạm</th>
                <th>Chi tiết / Link bằng chứng</th>
                <th>Mức độ</th>
                <th>Trạng thái</th>
                <th class="right">Hành động</th>
              </tr>
            </thead>
            <tbody id="reportsTableBody">
              <!-- JS -->
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div class="toast" id="toast" role="status" aria-live="polite">
  <span class="check">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true">
      <path d="M2 5L4 7L8 3" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </span>
  <span id="toastMsg">Thành công</span>
</div>

<script>
(function(){
  'use strict';

    const PAGE_TITLES = {
    dashboard: 'Dashboard',
    tasks: 'Quản lý nhiệm vụ',
    transactions: 'Giao dịch nạp tiền',
    users: 'Danh sách users',
    reports: 'Xử lý vi phạm',
    'user-config': 'Cấu hình tài khoản',
    config: 'Cấu hình chung',
    logs: 'Nhật ký hoạt động',
    stats: 'Thống kê hệ thống'
  };

  /* ============ SIDEBAR NAVIGATION ============ */
  document.querySelectorAll('.sidebar-link').forEach(link => {
    link.addEventListener('click', () => {
      const view = link.dataset.view;
      if (view === 'stats') {
        window.location.href = '/admin/stats';
        return;
      } else if (view === 'tasks') {
        window.location.href = '/admin/tasks';
        return;
      } else if (view === 'transactions') {
        window.location.href = '/admin/transactions';
        return;
      } else if (view === 'users') {
        window.location.href = '/admin/users';
        return;
      } else if (view === 'reports') {
        window.location.href = '/admin/reports';
        return;
      } else if (view === 'user-config') {
        window.location.href = '/admin/user-config';
        return;
      } else if (view === 'config') {
        window.location.href = '/admin/config';
        return;
      } else if (view === 'logs') {
        window.location.href = '/admin/logs';
        return;
      } else if (view === 'dashboard') {
        window.location.href = '/admin';
        return;
      }
      
      document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      const titleEl = document.getElementById('pageTitle');
      if (titleEl) titleEl.textContent = PAGE_TITLES[view] || 'Admin';
      closeSidebar();
    });
  });

  /* ============ SIDEBAR MOBILE ============ */
  const sidebar = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const menuToggle = document.getElementById('menuToggle');

  function openSidebar() {
    if (sidebar) sidebar.classList.add('open');
    if (sidebarBackdrop) sidebarBackdrop.classList.add('on');
    document.body.style.overflow = 'hidden';
  }
  function closeSidebar() {
    if (sidebar) sidebar.classList.remove('open');
    if (sidebarBackdrop) sidebarBackdrop.classList.remove('on');
    document.body.style.overflow = '';
  }
  if (menuToggle) menuToggle.addEventListener('click', openSidebar);
  if (sidebarBackdrop) sidebarBackdrop.addEventListener('click', closeSidebar);

  /* ============ REFRESH ============ */
  const refreshBtn = document.getElementById('refreshBtn');
  if (refreshBtn) {
    refreshBtn.addEventListener('click', function() {
      this.style.transform = 'rotate(360deg)';
      this.style.transition = 'transform .6s ease';
      setTimeout(() => {
        this.style.transform = '';
        this.style.transition = '';
      }, 600);
      showToast('Đã làm mới dữ liệu.');
    });
  }

  /* ============ MODAL CLOSE ============ */
  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
    if (!document.querySelector('.modal-overlay.active')) {
      document.body.style.overflow = '';
    }
  }
  window.closeModal = closeModal;

  document.querySelectorAll('[data-close]').forEach(b => {
    b.addEventListener('click', () => {
      const overlay = b.closest('.modal-overlay');
      if (overlay) closeModal(overlay.id);
    });
  });
  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); });
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay.active').forEach(m => closeModal(m.id));
      closeSidebar();
    }
  });

  /* ============ TOAST ============ */
  const toast = document.getElementById('toast');
  const toastMsg = document.getElementById('toastMsg');
  let toastTimer;
  window.showToast = function(msg) {
    if (!toast) return;
    toastMsg.textContent = msg;
    toast.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('on'), 2800);
  };

})();
</script>
<script>
(function(){
  'use strict';
  
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  const ALL_REPORTS = {{ reports_data | tojson | safe }} || [];

  function renderTable() {
    const q = (document.getElementById('searchReports').value || '').toLowerCase();
    const reason = document.getElementById('filterReason').value;
    const stat = document.getElementById('filterStatus').value;

    let list = ALL_REPORTS.slice();
    if(q) {
      list = list.filter(x => x.id.toLowerCase().includes(q) || x.accused.toLowerCase().includes(q) || x.handle.toLowerCase().includes(q));
    }
    if(reason) list = list.filter(x => x.reasonType === reason);
    if(stat) list = list.filter(x => x.status === stat);

    const tbody = document.getElementById('reportsTableBody');
    if(!list.length) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:2.5rem;color:var(--muted);font-size:.8125rem">Không tìm thấy báo cáo nào.</td></tr>';
      return;
    }

    tbody.innerHTML = list.map(r => {
      let sevClass = 'mute';
      if(r.severity === 'high') sevClass = 'danger';
      if(r.severity === 'medium') sevClass = 'warn';
      if(r.severity === 'low') sevClass = 'info';

      let stClass = 'mute';
      if(r.status === 'pending') stClass = 'warn';
      if(r.status === 'reviewing') stClass = 'info';
      if(r.status === 'resolved') stClass = 'ok';

      let actions = '';
      if(r.status !== 'resolved') {
        actions = `
          <button class="btn btn-danger btn-sm" onclick="showToast('Đã khóa tài khoản ${r.handle}')">Khóa</button>
          <button class="btn btn-secondary btn-sm" onclick="showToast('Bỏ qua báo cáo ${r.id}')">Bỏ qua</button>
        `;
      } else {
        actions = `<span class="cell-mono" style="color:var(--muted)">Đã đóng</span>`;
      }

      let linkDisplay = r.link.startsWith('http') ? `<a href="${r.link}" target="_blank" style="color:var(--accent);text-decoration:underline;">Link dẫn chứng</a>` : `<span class="cell-mono">${r.link}</span>`;

      return `
        <tr>
          <td><span class="cell-mono">${r.id}</span></td>
          <td>
            <div class="user-cell">
              <span class="mini-avatar">${escapeHtml(r.accused.charAt(0))}</span>
              <div>
                <div class="user-cell-name">${escapeHtml(r.accused)}</div>
                <div class="user-cell-handle">${escapeHtml(r.handle)}</div>
              </div>
            </div>
          </td>
          <td><span class="status-pill mute">${escapeHtml(r.reasonType)}</span></td>
          <td>
            <div style="font-size:13px;max-width:250px;white-space:normal;line-height:1.4">${escapeHtml(r.desc)}</div>
            <div style="margin-top:4px;font-size:12px;">${linkDisplay}</div>
          </td>
          <td><span class="status-pill ${sevClass}">${r.severityLabel}</span></td>
          <td><span class="status-pill ${stClass}">${r.statusLabel}</span></td>
          <td class="cell-right">
            <div class="row-actions">${actions}</div>
          </td>
        </tr>
      `;
    }).join('');
  }

  document.getElementById('searchReports').addEventListener('input', renderTable);
  document.getElementById('filterReason').addEventListener('change', renderTable);
  document.getElementById('filterStatus').addEventListener('change', renderTable);

  renderTable();
})();
</script>

</body>
</html>
